<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cards & Widgets</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div id="profile" class="card">
            <img src="images/" alt="profile.">
            <h2>John Doe</h2>
            <p>
                An esteemed young man.
            </p>
        </div>
        <div id="weather" class="widget">
            <h2>Weather</h2>
            <p>
                80&deg;
            </p>
        </div>
        <div id="music" class="widget">
            <h2>Currently Playing:</h2>
            <p>
                Dame Beso // Muevete by Kali Uchis
            </p>
        </div>
        <div id="weather" class="widget">
            <h2>Date</h2>
            <p>
                March 20th, 2026
            </p>
        </div>
    </body>
</html>
