<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
        <link rel="icon" type="image/svg+xml" href="favicon.svg">
        <title>Instructor Map — 2026</title>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body {
                font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                background: #f9fafb;
                color: #1a1a2e;
                line-height: 1.4;
            }
            .app-container { max-width: 960px; margin: 0 auto; padding: 16px; }
            .header { margin-bottom: 14px; }
            .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 2px; }
            .header-sub { font-size: 12px; color: #888; margin-top: 2px; }
            .tab-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
            .tab-group { display: flex; gap: 4px; background: #f1f1f1; border-radius: 10px; padding: 4px; }
            .tab-btn { padding: 7px 18px; border-radius: 8px; font-size: 13px; font-weight: 400; cursor: pointer; background: transparent; border: none; color: #555; }
            .tab-btn.active { background: #1a1a2e; color: #fff; font-weight: 600; }
            .manage-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid #ddd; background: #fff; font-size: 12px; cursor: pointer; color: #555; margin-left: auto; }
            .manage-btn:hover { background: #f5f5f5; }
            .week-nav { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
            .week-nav button { padding: 5px 12px; border-radius: 7px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 13px; color: #333; }
            .week-nav button:disabled { color: #ccc; cursor: default; }
            .week-label { font-size: 13px; font-weight: 500; min-width: 155px; text-align: center; }
            .week-label span { font-size: 11px; color: #888; font-weight: 400; }
            .filter-select { padding: 5px 10px; border-radius: 7px; border: 1px solid #ddd; font-size: 12px; background: #fff; margin-left: auto; }
            .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
            .legend-item { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 500; border: 1px solid transparent; }
            .legend-dot { width: 6px; height: 6px; border-radius: 50%; }
            .legend-note { font-size: 11px; color: #9ca3af; align-self: center; margin-left: 4px; }
            .week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
            .day-card { border-radius: 8px; border: 1px solid #e5e7eb; background: #fff; padding: 8px; cursor: pointer; transition: box-shadow 0.12s; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
            .day-card:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.1); }
            .day-header { font-size: 12px; font-weight: 600; color: #374151; text-align: center; margin-bottom: 5px; }
            .day-date { font-size: 10px; color: #9ca3af; margin-bottom: 5px; }
            .cohort-card { border-radius: 5px; padding: 4px 7px; margin-bottom: 3px; }
            .cohort-header { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
            .cohort-code { font-size: 10px; font-weight: 700; }
            .cohort-week { font-size: 9px; color: #9ca3af; white-space: nowrap; }
            .cohort-detail { font-size: 10px; color: #374151; margin-top: 1px; line-height: 1.3; }
            .free-block { border-top: 1px solid #f5f5f5; padding-top: 4px; margin-top: 2px; }
            .free-label { font-size: 9px; color: #9ca3af; margin-bottom: 1px; }
            .free-names { font-size: 10px; color: #15803d; font-weight: 500; line-height: 1.5; }
            .click-hint { font-size: 11px; color: #d1d5db; margin-top: 6px; }
            .team-row { border: 1px solid #f0f0f0; border-radius: 10px; padding: 10px 14px; background: #fff; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
            .instructor-name { font-weight: 600; font-size: 13px; min-width: 70px; }
            .day-strip { display: flex; gap: 3px; flex: 1; min-width: 260px; }
            .day-cell { flex: 1; min-width: 0; border-radius: 6px; padding: 5px 4px; text-align: center; }
            .weekday { font-size: 9px; color: #9ca3af; margin-bottom: 2px; }
            .status-label { font-size: 10px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .stats { display: flex; gap: 8px; font-size: 11px; color: #9ca3af; white-space: nowrap; }
            .stat-busy { color: #374151; font-weight: 500; }
            .stat-free { color: #15803d; font-weight: 500; }
            .cohorts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 10px; margin-top: 8px; }
            .cohort-card-large { background: #fff; border-radius: 10px; padding: 13px 15px; cursor: pointer; transition: box-shadow 0.12s; }
            .cohort-card-large:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
            .cohort-title { font-size: 15px; font-weight: 700; color: #1a1a2e; margin-bottom: 2px; }
            .cohort-meta { font-size: 11px; color: #888; margin-bottom: 5px; }
            .cohort-badge { font-size: 11px; border-radius: 4px; padding: 2px 6px; display: inline-block; margin-bottom: 5px; font-weight: 500; }
            .cohort-days { font-size: 11px; color: #9ca3af; }
            .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
            .modal-container { background: #fff; border-radius: 14px; padding: 22px 26px; width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
            .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
            .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #9ca3af; }
            .modal-title { font-size: 17px; font-weight: 700; color: #1a1a2e; }
            .edit-group { margin-bottom: 14px; }
            .edit-label { font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 8px; }
            .instructor-buttons { display: flex; flex-wrap: wrap; gap: 5px; }
            .instructor-btn { padding: 5px 12px; border-radius: 99px; font-size: 12px; cursor: pointer; font-weight: 500; border: 1px solid #e5e7eb; background: #f3f4f6; color: #374151; }
            .instructor-btn.selected { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
            .sub-btn.selected { background: #7c3aed; color: #fff; border-color: #7c3aed; }
            .avail-btn.selected { background: #f0fdf4; color: #15803d; border-color: #86efac; }
            .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
            .modal-actions button { padding: 8px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; }
            .btn-secondary { border: 1px solid #ddd; background: #f5f5f5; color: #444; }
            .btn-primary { border: none; background: #1a1a2e; color: #fff; font-weight: 600; }
            .free-banner { background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
            .slot-section { margin-bottom: 14px; }
            .slot-title { font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
            .assignment-card { border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; border-left-width: 3px; border-style: solid; }
            .assignment-info { flex: 1; }
            .assignment-header { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
            .cohort-name { font-size: 12px; font-weight: 700; }
            .week-badge { font-size: 11px; color: #9ca3af; }
            .assignment-course { font-size: 12px; font-weight: 600; color: #1a1a2e; margin-bottom: 4px; }
            .instructor-tags { display: flex; flex-wrap: wrap; gap: 4px; }
            .instructor-tag { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: #f3f4f6; color: #374151; font-weight: 500; }
            .sub-tag { background: #f5f3ff; color: #7c3aed; font-style: italic; }
            .edit-assignment-btn { padding: 3px 10px; border-radius: 6px; border: 1px solid #e5e7eb; background: #f9fafb; font-size: 11px; cursor: pointer; color: #6b7280; white-space: nowrap; flex-shrink: 0; }
            .cohort-detail-modules { margin-top: 14px; }
            .module-card { border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
            .module-header { padding: 10px 14px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; border-bottom: 1px solid rgba(0,0,0,0.1); }
            .module-title { font-size: 14px; font-weight: 700; }
            .module-dates { font-size: 11px; color: #9ca3af; }
            .module-instructors { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
            .module-body { padding: 10px 14px; }
            .day-chips { display: flex; flex-wrap: wrap; gap: 3px; }
            .day-chip { font-size: 10px; padding: 2px 6px; border-radius: 4px; cursor: default; }
            .import-banner { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
            .import-title { font-size: 12px; font-weight: 600; color: #0369a1; margin-bottom: 4px; }
            .import-desc { font-size: 11px; color: #0369a1; margin-bottom: 8px; }
            .import-btn { padding: 5px 14px; border-radius: 7px; border: 1px solid #bae6fd; background: #e0f2fe; color: #0369a1; font-size: 12px; cursor: pointer; font-weight: 500; }
            .cohort-row { border: 1px solid #f0f0f0; border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
            .cohort-color-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
            .cohort-select, .date-input { padding: 4px 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 12px; background: #fff; }

        </style>

                    });
                    const busyDays = weekSummary.filter(d => d.status === 'busy').length;
                    const freeDays = weekSummary.filter(d => d.status === 'free').length;
                    const offDays = weekSummary.filter(d => d.status === 'off').length;
                    html += `<div class="team-row">
                        <div class="instructor-name">${name}</div>
                        <div class="day-strip">`;
                    weekSummary.forEach((d,i) => {
                        let bg, border, textColor, label;
                        if (d.status === 'off') { bg='#f9fafb'; border='#f0f0f0'; textColor='#d1d5db'; label='Off'; }
                        else if (d.status === 'free') { bg='#f0fdf4'; border='#86efac'; textColor='#15803d'; label='Free'; }
                        else {
                            const all = [...d.teaching, ...d.subbing];
                            const color = all.length===1 ? getCourseColor(all[0].c, d.dateStr) : '#374151';
                            bg = all.length===1 ? color+'18' : '#f3f4f6';
                            border = all.length===1 ? color+'55' : '#e5e7eb';
                            textColor = all.length===1 ? color : '#374151';
                            label = all.map(a => a.c + (d.subbing.includes(a) ? '*' : '')).join(', ');
                        }
                        html += `<div class="day-cell" style="background:${bg}; border:1px solid ${border};">
                            <div class="weekday">${d.day}</div>
                            <div class="status-label" style="color:${textColor}">${label}</div>
                        </div>`;
                    });
                    html += `</div><div class="stats">
                        ${busyDays>0?`<span class="stat-busy">${busyDays} teaching</span>`:''}
                        ${freeDays>0?`<span class="stat-free">${freeDays} free</span>`:''}
                        ${offDays>0?`<span>${offDays} off</span>`:''}
                    </div></div>`;
                });
                teamViewContainer.innerHTML = html;
            }

            function renderCohortsView() {
                let html = `<div class="cohorts-grid">`;
                Object.entries(cohortInfo).forEach(([id, info]) => {
                    const dayCount = Object.values(schedData).filter(d => d.as.some(a => a.c === id)).length;
                    let currentMod = null;
                    const currentWeek = allWeeks[weekIdx];
                    const weekDates = currentWeek ? currentWeek.dates : [];
                    for (let dateStr of weekDates) {
                        const d = schedData[dateStr];
                        if (d) {
                            const a = d.as.find(x => x.c === id && cohortInfo[x.c]);
                            if (a) { currentMod = a.m; break; }
                        }
                    }
                    const color = currentMod ? COURSE_COLORS[currentMod] || '#888' : '#9ca3af';
                    html += `<div class="cohort-card-large" data-cohort="${id}" style="border-top:3px solid ${color}; border:1px solid ${color}33;">
                        <div class="cohort-title">Cohort ${id}</div>
                        <div class="cohort-meta">${info.slot==='d'?'Day':'Evening'} · ${fmt(info.start)} – ${fmt(info.end)}</div>
                        ${currentMod ? `<div class="cohort-badge" style="background:${color}12; color:${color}">Now: ${currentMod} · ${COURSES[currentMod]?.split(' ').slice(0,2).join(' ')||''}</div>` : ''}
                        <div class="cohort-days">${dayCount} class days · View →</div>
                    </div>`;
                });
                html += `</div>`;
                cohortsContainer.innerHTML = html;
                document.querySelectorAll('[data-cohort]').forEach(el => {
                    el.addEventListener('click', (e) => { selectedCohort = el.getAttribute('data-cohort'); renderAll(); });
                });
            }

            function renderModals() {
                if (!modalContainer) return;
                let modalHtml = '';
                if (selectedDay && !editTarget) modalHtml = renderDayModal();
                else if (editTarget) modalHtml = renderEditModal();
                else if (selectedCohort) modalHtml = renderCohortDetailModal();
                else if (showCohortManager) modalHtml = renderCohortManagerModal();
                modalContainer.innerHTML = modalHtml;
                if (modalHtml) attachModalEventListeners();
            }

            function renderDayModal() {
                const day = schedData[selectedDay];
                if (!day) return '';
                const av = day.av || [];
                const as = day.as;
                const teachingSet = new Set(as.flatMap(a => [...(a.i||[]), ...(a.sb||[])]));
                const free = av.filter(n => !teachingSet.has(n));
                const dayLabel = new Date(selectedDay+'T12:00:00').toLocaleDateString('en-US',{weekday:'long'});
                let slotsHtml = '';
                ['d','e'].forEach(slot => {
                    const slotAs = as.filter(a => a.s === slot && cohortInfo[a.c]);
                    if (!slotAs.length) return;
                    slotsHtml += `<div class="slot-section"><div class="slot-title">${slot==='d'?'Day · 9:00 AM – 2:00 PM':'Evening · 6:00 PM – 11:00 PM'}</div>`;
                    slotAs.forEach((a, idx) => {
                        const color = getCourseColor(a.c, selectedDay);
                        const wkInfo = getWkDay(a.c, selectedDay);
                        const globalIdx = as.indexOf(a);
                        slotsHtml += `<div class="assignment-card" style="border-left-color:${color}; border-color:${color}33;">
                            <div class="assignment-info">
                                <div class="assignment-header"><span class="cohort-name" style="color:${color}">${cohortLabel(a.c)}</span>${wkInfo ? `<span class="week-badge">W${wkInfo.w}D${wkInfo.d}</span>` : ''}</div>
                                <div class="assignment-course">${a.m} · ${COURSES[a.m]}</div>
                                <div class="instructor-tags">${(a.i||[]).map(n => `<span class="instructor-tag">${n}</span>`).join('')}${(a.sb||[]).map(n => `<span class="instructor-tag sub-tag">${n} (sub)</span>`).join('')}${!(a.i||[]).length && !(a.sb||[]).length ? `<span style="font-size:11px;color:#d1d5db">Not assigned</span>` : ''}</div>
                            </div>
                            <button class="edit-assignment-btn" data-date="${selectedDay}" data-idx="${globalIdx}">Edit</button>
                        </div>`;
                    });
                    slotsHtml += `</div>`;
                });
                return `<div class="modal-overlay" id="modalOverlay">
                    <div class="modal-container">
                        <div class="modal-header"><div><div style="font-size:12px;color:#9ca3af;margin-bottom:2px">${dayLabel}</div><div style="font-size:20px;font-weight:700">${fmtFull(selectedDay)}</div></div><button class="modal-close" id="closeModalBtn">✕</button></div>
                        ${free.length ? `<div class="free-banner"><span style="font-size:12px;font-weight:600;color:#15803d">Free to cover:</span> ${free.map(n=>`<span style="background:#dcfce7;padding:1px 8px;border-radius:99px;font-size:12px;color:#15803d">${n}</span>`).join('')}</div>` : ''}
                        ${slotsHtml}
                    </div>
                </div>`;
            }

            function renderEditModal() {
                const { dateStr, assignmentIdx } = editTarget;
                const day = schedData[dateStr];
                if (!day) return '';
                const a = day.as[assignmentIdx];
                if (!a) return '';
                const wkInfo = getWkDay(a.c, dateStr);
                const color = getCourseColor(a.c, dateStr);
                const instructors = a.i || [];
                const subs = a.sb || [];
                const available = day.av || [];
                const instructorBtns = ALL_INSTRUCTORS.map(name => `<button class="instructor-btn ${instructors.includes(name) ? 'selected' : ''}" data-instructor="${name}" data-type="instructor">${instructors.includes(name) ? '✓ ' : ''}${name}</button>`).join('');
                const subBtns = ALL_INSTRUCTORS.map(name => `<button class="instructor-btn sub-btn ${subs.includes(name) ? 'selected' : ''}" data-instructor="${name}" data-type="sub">${subs.includes(name) ? '✓ ' : ''}${name}</button>`).join('');
                const availBtns = ALL_INSTRUCTORS.map(name => `<button class="instructor-btn avail-btn ${available.includes(name) ? 'selected' : ''}" data-instructor="${name}" data-type="avail">${available.includes(name) ? '✓ ' : ''}${name}</button>`).join('');
                return `<div class="modal-overlay" id="modalOverlay">
                    <div class="modal-container" style="max-width:440px">
                        <div class="modal-header"><div><div style="font-size:11px;color:#9ca3af;margin-bottom:4px">${fmtFull(dateStr)}</div><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="padding:2px 9px;border-radius:6px;font-size:12px;font-weight:700;background:${color}18;color:${color};border:1px solid ${color}44">Cohort ${a.c} ${wkInfo ? `W${wkInfo.w}D${wkInfo.d}` : ''}</span></div><div style="font-size:13px;font-weight:600">${a.m} · ${COURSES[a.m]}</div><div style="font-size:11px;color:#888">${a.s==='d'?'Day · 9am–2pm':'Evening · 6pm–11pm'}</div></div><button class="modal-close" id="closeModalBtn">✕</button></div>
                        <div class="edit-group"><div class="edit-label">Lead Instructor(s)</div><div class="instructor-buttons" id="instructorBtns">${instructorBtns}</div></div>
                        <div class="edit-group"><button id="toggleSubsBtn" style="background:none;border:none;cursor:pointer;font-size:12px;color:#7c3aed;padding:0;font-weight:500;display:flex;align-items:center;gap:4px">▸ Substitute${subs.length?` (${subs.length})`:''}</button><div id="subsPanel" style="display:none;margin-top:8px"><div class="instructor-buttons">${subBtns}</div></div></div>
                        <div class="edit-group"><div class="edit-label">On duty this day</div><div class="instructor-buttons" id="availBtns">${availBtns}</div></div>
                        <div class="modal-actions"><button class="btn-secondary" id="cancelEditBtn">Cancel</button><button class="btn-primary" id="saveEditBtn">Save</button></div>
                    </div>
                </div>`;
            }

            function renderCohortDetailModal() {
                const cohortId = selectedCohort;
                const entries = [];
                for (const [date, day] of Object.entries(schedData).sort()) {
                    const a = day.as.find(x => x.c === cohortId);
                    if (a) entries.push({ date, module: a.m, slot: a.s, instructors: a.i||[], subs: a.sb||[] });
                }
                const byModule = {};
                entries.forEach(e => { if (!byModule[e.module]) byModule[e.module] = []; byModule[e.module].push(e); });
                const modules = Object.keys(byModule).sort((a,b)=>Number(a)-Number(b));
                const headerColor = entries.length ? getCourseColor(cohortId, entries[entries.length-1].date) : '#888';
                let modulesHtml = '';
                modules.forEach(mod => {
                    const days = byModule[mod];
                    const modColor = COURSE_COLORS[mod] || '#888';
                    const weeks = Math.ceil(days.length/5);
                    const instSet = [...new Set(days.flatMap(d => d.instructors))];
                    const subSet = [...new Set(days.flatMap(d => d.subs))];
                    modulesHtml += `<div class="module-card" style="border-color:${modColor}33">
                        <div class="module-header" style="background:${modColor}0e; border-bottom-color:${modColor}22">
                            <div><div class="module-title" style="color:${modColor}">${mod}</div><div style="font-size:13px;color:#374151">${COURSES[mod]}</div><div class="module-dates">${fmt(days[0].date)} – ${fmt(days[days.length-1].date)} · ${days.length} days (${weeks} wk${weeks!==1?'s':''})</div></div>
                            <div class="module-instructors">${instSet.map(n=>`<span style="font-size:11px;padding:1px 8px;border-radius:99px;background:#f3f4f6;color:#374151;white-space:nowrap">${n}</span>`).join('')}${subSet.map(n=>`<span style="font-size:11px;padding:1px 8px;border-radius:99px;background:#f5f3ff;color:#7c3aed;white-space:nowrap">${n} (sub)</span>`).join('')}</div>
                        </div>
                        <div class="module-body"><div class="day-chips">${days.map(d=>{const wk=getWkDay(cohortId,d.date);const hasSub=d.subs.length>0;const noInst=!d.instructors.length&&!d.subs.length;return `<span class="day-chip" style="background:${noInst?'#fef9c3':hasSub?'#f5f3ff':modColor+'14'};color:${noInst?'#92400e':hasSub?'#7c3aed':modColor};border:1px solid ${noInst?'#fcd34d':hasSub?'#c4b5fd':modColor+'44'}">${wk?`W${wk.w}D${wk.d}`:fmt(d.date)}</span>`;}).join('')}</div></div>
                    </div>`;
                });
                return `<div class="modal-overlay" id="modalOverlay">
                    <div class="modal-container" style="max-width:580px">
                        <div class="modal-header"><div><div style="font-size:22px;font-weight:700">Cohort ${cohortId}</div><div style="font-size:13px;color:#888">${entries.length} class days · ${modules.length} courses</div></div><button class="modal-close" id="closeModalBtn">✕</button></div>
                        <div style="height:2px;background:#f0f0f0;margin:14px 0 18px"></div>
                        ${modulesHtml}
                    </div>
                </div>`;
            }

            function renderCohortManagerModal() {
                let rows = '';
                Object.entries(cohortInfo).forEach(([id, info]) => {
                    const lastDate = Object.keys(schedData).filter(d => schedData[d].as.some(a=>a.c===id)).sort().pop();
                    const color = lastDate ? getCourseColor(id, lastDate) : '#888';
                    rows += `<div class="cohort-row" data-cohort-id="${id}">
                        <div class="cohort-color-dot" style="background:${color}"></div>
                        <div style="font-weight:600;font-size:13px;min-width:60px">Cohort ${id}</div>
                        <select class="cohort-select" data-field="slot" data-id="${id}"><option value="d" ${info.slot==='d'?'selected':''}>Day</option><option value="e" ${info.slot==='e'?'selected':''}>Evening</option></select>
                        <div><span style="font-size:11px;color:#9ca3af">Start</span> <input type="date" class="date-input" data-field="start" data-id="${id}" value="${info.start}"></div>
                        <div><span style="font-size:11px;color:#9ca3af">End</span> <input type="date" class="date-input" data-field="end" data-id="${id}" value="${info.end}"></div>
                        <button class="delete-cohort-btn" data-id="${id}">Remove</button>
                    </div>`;
                });
                return `<div class="modal-overlay" id="modalOverlay">
                    <div class="modal-container">
                        <div class="modal-header"><div class="modal-title">Manage Cohorts</div><button class="modal-close" id="closeModalBtn">✕</button></div>
                        <div class="import-banner"><div class="import-title">Import from file</div><div class="import-desc">Upload CSV with columns: cohort, slot (d/e), start (YYYY-MM-DD), end (YYYY-MM-DD)</div><input type="file" id="csvImportInput" accept=".csv" style="display:none"><button id="importCsvBtn" class="import-btn">Upload CSV</button></div>
                        <div id="cohortRows">${rows}</div>
                        <div class="modal-actions"><button class="btn-secondary" id="cancelManagerBtn">Cancel</button><button class="btn-primary" id="saveManagerBtn">Save changes</button></div>
                    </div>
                </div>`;
            }

            function attachModalEventListeners() {
                const overlay = document.getElementById('modalOverlay');
                if (!overlay) return;
                overlay.addEventListener('click', (e) => { if (e.target === overlay) closeAllModals(); });
                const closeBtn = document.getElementById('closeModalBtn');
                if (closeBtn) closeBtn.addEventListener('click', closeAllModals);
                if (editTarget) {
                    const instructorBtns = document.querySelectorAll('#instructorBtns .instructor-btn');
                    const subsPanel = document.getElementById('subsPanel');
                    const toggleSubs = document.getElementById('toggleSubsBtn');
                    if (toggleSubs) toggleSubs.addEventListener('click', () => { if(subsPanel) subsPanel.style.display = subsPanel.style.display === 'none' ? 'block' : 'none'; });
                    const subBtns = document.querySelectorAll('#subsPanel .instructor-btn');
                    const availBtns = document.querySelectorAll('#availBtns .instructor-btn');
                    const saveBtn = document.getElementById('saveEditBtn');
                    const cancelBtn = document.getElementById('cancelEditBtn');
                    if (saveBtn) saveBtn.addEventListener('click', () => {
                        const newInstructors = Array.from(document.querySelectorAll('#instructorBtns .instructor-btn.selected')).map(btn => btn.getAttribute('data-instructor'));
                        const newSubs = Array.from(document.querySelectorAll('#subsPanel .instructor-btn.selected')).map(btn => btn.getAttribute('data-instructor'));
                        const newAvail = Array.from(document.querySelectorAll('#availBtns .instructor-btn.selected')).map(btn => btn.getAttribute('data-instructor'));
                        schedData[editTarget.dateStr].as[editTarget.assignmentIdx].i = newInstructors;
                        schedData[editTarget.dateStr].as[editTarget.assignmentIdx].sb = newSubs;
                        schedData[editTarget.dateStr].av = newAvail;
                        editTarget = null;
                        selectedDay = editTarget.dateStr;
                        renderAll();
                    });
                    if (cancelBtn) cancelBtn.addEventListener('click', () => { editTarget = null; selectedDay = null; renderAll(); });
                    const attachToggle = (btns) => { btns.forEach(btn => { btn.addEventListener('click', () => { btn.classList.toggle('selected'); }); }); };
                    attachToggle(instructorBtns);
                    if (subBtns.length) attachToggle(subBtns);
                    attachToggle(availBtns);
                } else if (selectedDay && !editTarget) {
                    document.querySelectorAll('.edit-assignment-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const date = btn.getAttribute('data-date');
                            const idx = parseInt(btn.getAttribute('data-idx'),10);
                            editTarget = { dateStr: date, assignmentIdx: idx };
                            selectedDay = null;
                            renderAll();
                        });
                    });
                } else if (showCohortManager) {
                    const importBtn = document.getElementById('importCsvBtn');
                    const fileInput = document.getElementById('csvImportInput');
                    if (importBtn && fileInput) {
                        importBtn.addEventListener('click', () => fileInput.click());
                        fileInput.addEventListener('change', (e) => {
                            const file = e.target.files[0];
                            if (!file) return;
                            const reader = new FileReader();
                            reader.onload = ev => {
                                const lines = ev.target.result.split('\n').filter(l=>l.trim());
                                const newInfo = {};
                                const startLine = lines[0].toLowerCase().includes('cohort') ? 1 : 0;
                                for (let i=startLine; i<lines.length; i++) {
                                    const [cohort,slot,startDate,endDate] = lines[i].split(',').map(s=>s.trim());
                                    if (cohort && slot && startDate && endDate) newInfo[cohort] = { slot: slot.toLowerCase(), start: startDate, end: endDate };
                                }
                                if (Object.keys(newInfo).length) { cohortInfo = { ...cohortInfo, ...newInfo }; renderAll(); }
                                else alert('No valid rows found');
                            };
                            reader.readAsText(file);
                            fileInput.value = '';
                        });
                    }
                    const saveManager = document.getElementById('saveManagerBtn');
                    if (saveManager) {
                        saveManager.addEventListener('click', () => {
                            const rows = document.querySelectorAll('#cohortRows .cohort-row');
                            const updated = {};
                            rows.forEach(row => {
                                const id = row.getAttribute('data-cohort-id');
                                const slot = row.querySelector('[data-field="slot"]').value;
                                const start = row.querySelector('[data-field="start"]').value;
                                const end = row.querySelector('[data-field="end"]').value;
                                if (id && slot && start && end) updated[id] = { slot, start, end };
                            });
                            cohortInfo = updated;
                            showCohortManager = false;
                            renderAll();
                        });
                    }
                    const cancelManager = document.getElementById('cancelManagerBtn');
                    if (cancelManager) cancelManager.addEventListener('click', () => { showCohortManager = false; renderAll(); });
                    document.querySelectorAll('.delete-cohort-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const id = btn.getAttribute('data-id');
                            if (confirm(`Remove cohort ${id}?`)) {
                                delete cohortInfo[id];
                                Object.keys(schedData).forEach(date => { schedData[date].as = schedData[date].as.filter(a => a.c !== id); });
                                renderAll();
                            }
                        });
                    });
                }
            }

            function closeAllModals() { selectedDay = null; editTarget = null; selectedCohort = null; showCohortManager = false; renderAll(); }

            function initEventListeners() {
                weekNavPrev = document.getElementById('weekPrev');
                weekNavNext = document.getElementById('weekNext');
                if (weekNavPrev) weekNavPrev.addEventListener('click', () => { weekIdx = Math.max(0, weekIdx-1); renderAll(); });
                if (weekNavNext) weekNavNext.addEventListener('click', () => { weekIdx = Math.min(allWeeks.length-1, weekIdx+1); renderAll(); });
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        tab = btn.getAttribute('data-tab');
                        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        renderAll();
                    });
                });
                const manageBtn = document.getElementById('manageCohortsBtn');
                if (manageBtn) manageBtn.addEventListener('click', () => { showCohortManager = true; renderAll(); });
                filterInstructorSelect = document.getElementById('filterInstructor');
                filterSlotSelect = document.getElementById('filterSlot');
                if (filterInstructorSelect) filterInstructorSelect.addEventListener('change', (e) => { filterInstructor = e.target.value; renderAll(); });
                if (filterSlotSelect) filterSlotSelect.addEventListener('change', (e) => { filterSlot = e.target.value; renderAll(); });
            }

            window.addEventListener('DOMContentLoaded', () => {
                const appRoot = document.getElementById('app-root');
                appRoot.innerHTML = `
                    <div class="app-container">
                        <div class="header"><h1>Instructor Map — 2026</h1><div class="header-sub">12 instructors · ${Object.keys(cohortInfo).length} cohorts · Click any day to view and edit</div></div>
                        <div class="tab-bar"><div class="tab-group"><button class="tab-btn active" data-tab="week">Week View</button><button class="tab-btn" data-tab="team">Team Overview</button><button class="tab-btn" data-tab="cohorts">Cohorts</button></div><button id="manageCohortsBtn" class="manage-btn">Manage cohorts</button></div>
                        <div class="week-nav"><button id="weekPrev">←</button><div id="weekLabel" class="week-label"></div><button id="weekNext">→</button><select id="filterInstructor" class="filter-select"><option value="">All instructors</option>${ALL_INSTRUCTORS.map(n=>`<option value="${n}">${n}</option>`).join('')}</select><select id="filterSlot" class="filter-select"><option value="">Both slots</option><option value="d">Day only</option><option value="e">Evening only</option></select></div>
                        <div class="legend" id="courseLegend"></div>
                        <div id="weekView"></div>
                        <div id="teamView" style="display:none"></div>
                        <div id="cohortsView" style="display:none"></div>
                        <div id="modalContainer"></div>
                    </div>
                `;
                weekViewContainer = document.getElementById('weekView');
                teamViewContainer = document.getElementById('teamView');
                cohortsContainer = document.getElementById('cohortsView');
                modalContainer = document.getElementById('modalContainer');
                currentWeekLabelEl = document.getElementById('weekLabel');
                const legendEl = document.getElementById('courseLegend');
                legendEl.innerHTML = Object.entries(COURSES).map(([num,name]) => `<span class="legend-item" style="background:${COURSE_COLORS[num]}18;color:${COURSE_COLORS[num]};border-color:${COURSE_COLORS[num]}44"><span class="legend-dot" style="background:${COURSE_COLORS[num]}"></span>${num}</span>`).join('') + `<span class="legend-note">Color = current course</span>`;
                initEventListeners();
                renderAll();
            });
        </script>
    </body>
</html>
